# Reload configuration
unbind-key r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Prefix and general behavior
set-option -g prefix C-s
set-option -g mouse on
set-option -g detach-on-destroy off
set-option -g focus-events on
set-option -g history-limit 50000
set-option -g status-position top

# Terminal capabilities
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB"
set-option -as terminal-features ",xterm-ghostty:RGB"

# Start windows and panes at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Pane and window management
bind-key x kill-pane
bind-key -n M-h resize-pane -L
bind-key -n M-j resize-pane -D
bind-key -n M-k resize-pane -U
bind-key -n M-l resize-pane -R
bind-key -n M-i swap-window -t -1
bind-key -n M-o swap-window -t +1

# Vi-style copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Session persistence
set-option -g @resurrect-save 'S'
set-option -g @resurrect-restore 'R'
set-option -g @resurrect-strategy-nvim 'session'

# Sesh session picker
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Catppuccin
set-option -g @catppuccin_flavor "mocha"
set-option -g @catppuccin_window_status_style "rounded"
set-option -g status-right-length 100
set-option -g status-left-length 100
set-option -g status-left ""
set-option -g status-right "#{E:@catppuccin_status_application}"
set-option -agF status-right "#{E:@catppuccin_status_cpu}"
set-option -agF status-right "#{E:@catppuccin_status_ram}"
set-option -ag status-right "#{E:@catppuccin_status_session}"
set-option -ag status-right "#{E:@catppuccin_status_uptime}"
set-option -agF status-right "#{E:@catppuccin_status_battery}"

# Plugins
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-sensible'
set-option -g @plugin 'christoomey/vim-tmux-navigator'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @plugin 'catppuccin/tmux#v2.3.0'
set-option -g @plugin 'tmux-plugins/tmux-cpu'
set-option -g @plugin 'tmux-plugins/tmux-battery'

# Initialize TPM. Keep this at the bottom.
run-shell '~/.tmux/plugins/tpm/tpm'
